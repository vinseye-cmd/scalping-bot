name: Scalping Bot BTC

on:
  schedule:
    - cron: '*/5 * * * *'   # toutes les 5 minutes, 24h/24
  workflow_dispatch:          # déclenchement manuel possible

concurrency:
  group: scalping-bot
  cancel-in-progress: false   # attend la fin si un cycle est déjà en cours

jobs:
  trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install pandas numpy requests python-dotenv pytz

      - name: Lancer le cycle du bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MOONX_API_TOKEN: ${{ secrets.MOONX_API_TOKEN }}
          SYMBOL: BTCUSDT
          MOONX_SYMBOL: BTC
          INTERVAL: 5m
          ATR_PERIOD: "10"
          ATR_MULTIPLIER: "3.0"
          EMA_PERIOD: "21"
          LEVERAGE: "10"
          RISK_PCT: "1.0"
          RR_TP1: "1.0"
          RR_TP2: "3.0"
          MAX_CONSECUTIVE_LOSSES: "2"
          TRADING_WINDOWS: "09:00-13:00,14:00-17:00,20:00-23:00"
        run: python bot_cycle.py

      - name: Sauvegarder l'état
        run: |
          git config user.email "actions@github.com"
          git config user.name "Scalping Bot"
          git add state_auto.json
          git diff --staged --quiet || git commit -m "bot: update state [skip ci]"
          git push
